services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tapcampus_redisdata:/data
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: tapcampus
      POSTGRES_PASSWORD: tapcampus_dev_password
      POSTGRES_DB: tapcampus_db
    ports:
      - "127.0.0.1:6000:5432"
    volumes:
      - tapcampus_pgdata:/var/lib/postgresql/data

volumes:
  tapcampus_redisdata:
  tapcampus_pgdata:

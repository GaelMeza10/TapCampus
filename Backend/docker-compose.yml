services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: tapcampus
      POSTGRES_PASSWORD: tapcampus_dev_password
      POSTGRES_DB: tapcampus_db
    ports:
      - "5432:5432"
    volumes:
      - tapcampus_pgdata:/var/lib/postgresql/data

volumes:
  tapcampus_pgdata:
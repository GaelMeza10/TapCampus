# Plan gratuito de Render (demostración académica).
# Limitaciones: la API se duerme tras 15 min sin uso (~1 min en despertar),
# las fotos subidas por usuarios se pierden al reiniciar (sin disco persistente),
# Redis no conserva datos (la conciliación reprograma los jobs desde PostgreSQL)
# y la base gratuita vence a los 30 días.
services:
  - type: web
    name: tapcampus-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /categories
    numInstances: 1
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tapcampus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tapcampus-jobs
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_PASSWORD
        generateValue: true
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: BULLMQ_PREFIX
        value: tapcampus-production
  - type: keyvalue
    name: tapcampus-jobs
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: tapcampus-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
